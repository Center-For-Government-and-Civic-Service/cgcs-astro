name: Update partner events

on:
  schedule:
    # Daily at 13:00 UTC (7am CST / 8am CDT)
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync partner events
        id: sync
        run: |
          node scripts/sync-partner-events.mjs | tee report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify site still builds
        if: steps.sync.outputs.added != '0'
        run: |
          npm ci
          npx astro build

      - name: Commit and push new events
        if: steps.sync.outputs.added != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/events.ts
          git commit -m "events: auto-add partner events — ${{ steps.sync.outputs.summary }}"
          git push
